<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2c30" />
    <title>Offline · Fokus</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #2b2c30;
        color: #eceef2;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        padding: 2.5rem 2rem;
        border-radius: 26px;
        background: linear-gradient(145deg, #303137, #26272b);
        box-shadow: 7px 7px 16px #1c1d20, -7px -7px 16px #3b3c43;
      }
      .badge {
        display: grid;
        place-items: center;
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.5rem;
        border-radius: 20px;
        font-size: 1.5rem;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(135deg, #ff9040, #ef3f14);
        box-shadow: 0 10px 26px -6px rgba(239, 63, 20, 0.45);
      }
      h1 { margin: 0 0 0.75rem; font-size: 1.4rem; letter-spacing: -0.02em; }
      p { margin: 0 0 1.75rem; font-size: 0.9rem; line-height: 1.6; color: #a2a6b0; }
      button {
        height: 3rem;
        padding: 0 1.75rem;
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #ff9040, #ef3f14);
        box-shadow: 0 10px 26px -6px rgba(239, 63, 20, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">F</div>
      <h1>Keine Verbindung</h1>
      <p>
        Fokus braucht das Netz, um deine Projekte zu laden. Sobald du wieder online bist,
        geht es genau hier weiter.
      </p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </div>
  </body>
</html>
